name: Neon persistence safety tests

on:
  push:
    branches:
      - test_neon
  pull_request:
    branches:
      - FTP_2.0
      - test_neon

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile backend and persistence adapter
        run: python -m py_compile ftp_backend_service.py ftp/session/neon_persistence.py ftp/session/coordinator.py ftp/events/store.py
      - name: Run Neon persistence unit tests
        run: python -m pytest -q tests/test_neon_persistence_unit.py
      - name: Run full test suite
        run: python -m pytest -q
